[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icinga-mcp"
version = "0.1.0"
description = "MCP/MCPO + FastAPI bridge for Icinga Web 2 (Icinga DB Web module)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Bernd Erk - Icinga GmbH" }]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "tenacity>=9.0.0",
  "structlog>=24.1.0",
  "anyio>=4.4.0",
  "typing-extensions>=4.12.2",
  "rich>=13.9.2",
  "mcp>=1.0.0b5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.7",
  "respx>=0.21.1",
  "coverage>=7.6.0",
  "black>=24.8.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "pre-commit>=3.8.0",
  "types-requests",
  "types-setuptools",
]

[project.scripts]
icinga-mcp-rest = "icinga_mcp.cli:run_rest"
icinga-mcp-server = "icinga_mcp.cli:run_mcp"
icinga-mcp-health = "icinga_mcp.cli:health"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E","F","W","I","UP","N","B","ASYNC","A","C4","PIE"]
lint.ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict_optional = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["icinga_mcp*"]
